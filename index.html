<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to resolve to
         anything other than 0 on notched devices. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      Content-Security-Policy.

      base-uri, form-action and frame-ancestors do NOT fall back to default-src,
      so they have to be stated explicitly or they are simply absent.

      - base-uri 'none'    : there is no <base> element; blocks base-tag injection
                             from silently repointing every relative URL.
      - form-action 'none' : both forms are preventDefault-only and never submit,
                             so nothing legitimate is lost. Blocks an injected
                             form from posting anywhere. Relax to 'self' if a real
                             submission is ever added.
      - object-src 'none'  : covered by default-src, but stated explicitly because
                             plugin content is the one thing that should never be
                             permitted by accident.
      - img-src keeps data: : Vite inlines assets under 4 KB as data URIs, so
                             removing it would be a latent trap rather than a
                             tightening. data: images are not a meaningful
                             injection vector; data: in script-src would be, and
                             that is already denied via default-src.
      - style-src keeps 'unsafe-inline' : App.tsx uses inline style props
                             throughout; removing it is a much larger refactor.

      frame-ancestors is absent on purpose: it is ignored inside a meta tag by
      spec, and GitHub Pages cannot send response headers. Clickjacking is handled
      separately with a scripted frame check.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; connect-src 'self' https://api.airplanes.live; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; upgrade-insecure-requests"
    />
    <!-- The only referrer control available without response headers. After
         self-hosting the font there is no third party left to leak to, but this
         makes that durable. -->
    <meta name="referrer" content="no-referrer" />
    <title>SkyNoise Tracker</title>
    <meta name="theme-color" content="#0b0f19" />
    <!-- The manifest carries theme_color too, but iOS and some in-app browsers
         only read the meta tag. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Self-hosted variable font: one file covers weights 400-800. Preloaded
         because the stylesheet that references it is discovered a round-trip
         later. crossorigin is required on font preloads even same-origin. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/outfit-latin-var.woff2"
      crossorigin
    />
  </head>
  <body style="margin: 0; background-color: #0b0f19">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
