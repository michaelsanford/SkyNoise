<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to resolve to
         anything other than 0 on notched devices. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://api.airplanes.live; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:;" />
    <title>SkyNoise Tracker</title>
    <meta name="theme-color" content="#0b0f19" />
    <!-- The manifest carries theme_color too, but iOS and some in-app browsers
         only read the meta tag. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Self-hosted variable font: one file covers weights 400-800. Preloaded
         because the stylesheet that references it is discovered a round-trip
         later. crossorigin is required on font preloads even same-origin. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/outfit-latin-var.woff2" crossorigin />
  </head>
  <body style="margin: 0; background-color: #0b0f19;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
