name: CI Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Allows deploy.yml to reuse this workflow as a prerequisite, so a failing
  # lint/typecheck/test/build cannot reach GitHub Pages.
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    # Stable name so it can be referenced as a required status check on `main`.
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Signal only, deliberately non-blocking and --omit=dev. The current 8
      # "high" findings are ejs/jake reached transitively through
      # vite-plugin-pwa -> workbox-build: build-time only, never in the shipped
      # bundle, and with no non-breaking upgrade available. Gating on them would
      # make CI permanently red, which teaches everyone to ignore CI. Scoping to
      # production deps means a finding here is one that actually reaches users.
      - name: Dependency Audit (production, advisory)
        run: npm audit --omit=dev --audit-level=moderate
        continue-on-error: true

      - name: Code Linting
        run: npm run lint

      # `tsc --noEmit` without -b resolves the solution tsconfig.json (files: [])
      # and checks zero files. `tsc -b --force` walks the project references.
      - name: TypeScript Compilation Check
        run: npm run typecheck

      - name: Run Test Suite
        run: npm run test

      - name: Production Build Check
        run: npm run build
        env:
          VITE_COMMIT_SHA: ${{ github.sha }}
