name: Feature request
description: Suggest an enhancement or new feature idea.
title: "[Feature]: "
labels: ["enhancement"]
assignees:
  - michaelsanford
body:
  - type: markdown
    attributes:
      value: |
        Have an idea or improvement? Share it below!
  - type: input
    id: country
    attributes:
      label: Country or region (optional)
      description: Only if relevant to the request — aviation and airport rules vary by region. Leave blank if you would rather not say.
      placeholder: "e.g. Canada, United States"
  - type: textarea
    id: idea
    attributes:
      label: Proposed feature
      description: What should the app do? Why is this helpful?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other ways this could be solved?
    validations:
      required: false
